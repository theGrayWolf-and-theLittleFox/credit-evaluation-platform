<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter></defs><rect width="1600" height="980" fill="#FFFFFF"/><text x="56" y="58" font-family="Arial" font-size="30" font-weight="700" fill="#153B64" text-anchor="start">Fairness monitoring and mitigation control loop</text><text x="56" y="91" font-family="Arial" font-size="17" font-weight="400" fill="#52616F" text-anchor="start">Metric computation is subordinate to data quality, statistical uncertainty, legal review, and operational action</text><line x1="56" y1="112" x2="1544" y2="112" stroke="#2E74B5" stroke-width="3"/><rect x="70" y="210" width="285" height="130" rx="8" fill="#F4F6F8" stroke="#AAB7C4" stroke-width="2"/><text x="86" y="239" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">1. Cohort assembly</text><text x="86" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Product, population, decision</text><text x="86" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">policy, observation horizon,</text><text x="86" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">label maturity, exclusions</text><rect x="410" y="210" width="285" height="130" rx="8" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="426" y="239" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">2. Data checks</text><text x="426" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Group counts, missingness,</text><text x="426" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">provider coverage, token</text><text x="426" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">linkage, small-cell</text><text x="426" y="325" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">suppression</text><rect x="750" y="210" width="285" height="130" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="766" y="239" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">3. Metric engine</text><text x="766" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Selection rate, TPR/FPR,</text><text x="766" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">PPV/NPV, calibration, AUC,</text><text x="766" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">reason and override rates</text><rect x="1090" y="210" width="285" height="130" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="1106" y="239" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">4. Statistical layer</text><text x="1106" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Confidence intervals,</text><text x="1106" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">bootstrap, practical effect,</text><text x="1106" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">multiple testing, stability</text><text x="1106" y="325" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">flag</text><rect x="1090" y="500" width="285" height="130" rx="8" fill="#FFF1CC" stroke="#A96400" stroke-width="2"/><text x="1106" y="529" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">5. Trigger evaluation</text><text x="1106" y="555" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Approved control bands, 0.80</text><text x="1106" y="575" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">ratio as screen only, drift</text><text x="1106" y="595" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">and explanation alarms</text><rect x="750" y="500" width="285" height="130" rx="8" fill="#FFF1CC" stroke="#A96400" stroke-width="2"/><text x="766" y="529" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">6. Root-cause analysis</text><text x="766" y="555" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Data coverage, proxies,</text><text x="766" y="575" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">labels, model fit, threshold</text><text x="766" y="595" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">policy, human overrides</text><rect x="410" y="500" width="285" height="130" rx="8" fill="#EEE5F7" stroke="#6941A5" stroke-width="2"/><text x="426" y="529" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">7. Mitigation experiment</text><text x="426" y="555" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Data repair, feature</text><text x="426" y="575" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">refinement, constraints,</text><text x="426" y="595" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">recalibration, deferral,</text><text x="426" y="615" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">process change</text><rect x="70" y="500" width="285" height="130" rx="8" fill="#EEE5F7" stroke="#6941A5" stroke-width="2"/><text x="86" y="529" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">8. Governance decision</text><text x="86" y="555" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Approve, condition, reject,</text><text x="86" y="575" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">roll back, collect evidence;</text><text x="86" y="595" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">record owner and residual risk</text><line x1="355" y1="275" x2="410" y2="275" stroke="#2E74B5" stroke-width="2" marker-end="url(#arrow)"/><line x1="695" y1="275" x2="750" y2="275" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><line x1="1035" y1="275" x2="1090" y2="275" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><line x1="1232" y1="340" x2="1232" y2="500" stroke="#A96400" stroke-width="2" marker-end="url(#arrow)"/><line x1="1090" y1="565" x2="1035" y2="565" stroke="#A96400" stroke-width="2" marker-end="url(#arrow)"/><line x1="750" y1="565" x2="695" y2="565" stroke="#6941A5" stroke-width="2" marker-end="url(#arrow)"/><line x1="410" y1="565" x2="355" y2="565" stroke="#6941A5" stroke-width="2" marker-end="url(#arrow)"/><path d="M212 500 V425 H212 V340" fill="none" stroke="#6941A5" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="170" y="725" width="1260" height="135" rx="10" fill="#FCE1E0" stroke="#B3261E" stroke-width="2"/><text x="195" y="758" font-family="Arial" font-size="19" font-weight="700" fill="#B3261E" text-anchor="start">Release rule</text><text x="195" y="790" font-family="Arial" font-size="16" font-weight="400" fill="#172B4D" text-anchor="start">No model advances on a favorable point estimate alone. Review denominators, uncertainty, intersections, calibration,</text><text x="195" y="818" font-family="Arial" font-size="16" font-weight="400" fill="#172B4D" text-anchor="start">explanation fidelity, operational overrides, and legal constraints. Every mitigation is re-tested for performance and stability.</text><rect x="550" y="890" width="609" height="28" rx="14" fill="#FFF1CC" stroke="#A96400" stroke-width="1"/><text x="562" y="909" font-family="Arial" font-size="13" font-weight="700" fill="#172B4D" text-anchor="start">continuous path: outcomes and complaints re-enter cohort assembly</text></svg>