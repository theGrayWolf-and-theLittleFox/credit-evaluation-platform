<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter></defs><rect width="1600" height="980" fill="#FFFFFF"/><text x="56" y="58" font-family="Arial" font-size="30" font-weight="700" fill="#153B64" text-anchor="start">Model lifecycle and approval gates</text><text x="56" y="91" font-family="Arial" font-size="17" font-weight="400" fill="#52616F" text-anchor="start">Every transition emits immutable evidence; failure returns the artifact to the responsible stage</text><line x1="56" y1="112" x2="1544" y2="112" stroke="#2E74B5" stroke-width="3"/><rect x="65" y="185" width="310" height="125" rx="8" fill="#F4F6F8" stroke="#AAB7C4" stroke-width="2"/><text x="81" y="214" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">1. Data snapshot</text><text x="81" y="240" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">provenance, consent, scope, label</text><text x="81" y="260" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">maturity</text><line x1="375" y1="248" x2="445" y2="248" stroke="#AAB7C4" stroke-width="2" marker-end="url(#arrow)"/><rect x="445" y="185" width="310" height="125" rx="8" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="461" y="214" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">2. Feature build</text><text x="461" y="240" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">contract, transforms, leakage and</text><text x="461" y="260" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">proxy review</text><line x1="755" y1="248" x2="825" y2="248" stroke="#2E74B5" stroke-width="2" marker-end="url(#arrow)"/><rect x="825" y="185" width="310" height="125" rx="8" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="841" y="214" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">3. Candidate train</text><text x="841" y="240" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">baseline, challenger,</text><text x="841" y="260" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">convergence, reproducibility</text><line x1="1135" y1="248" x2="1205" y2="248" stroke="#2E74B5" stroke-width="2" marker-end="url(#arrow)"/><rect x="1205" y="185" width="310" height="125" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="1221" y="214" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">4. Evaluation</text><text x="1221" y="240" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">performance, calibration,</text><text x="1221" y="260" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">stability, stress</text><rect x="65" y="510" width="310" height="125" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="81" y="539" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">5. Fairness review</text><text x="81" y="565" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">selection, errors, calibration,</text><text x="81" y="585" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">uncertainty</text><line x1="375" y1="573" x2="445" y2="573" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><rect x="445" y="510" width="310" height="125" rx="8" fill="#EEE5F7" stroke="#6941A5" stroke-width="2"/><text x="461" y="539" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">6. Independent validation</text><text x="461" y="565" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">conceptual soundness,</text><text x="461" y="585" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">implementation, outcomes</text><line x1="755" y1="573" x2="825" y2="573" stroke="#6941A5" stroke-width="2" marker-end="url(#arrow)"/><rect x="825" y="510" width="310" height="125" rx="8" fill="#EEE5F7" stroke="#6941A5" stroke-width="2"/><text x="841" y="539" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">7. Approval + registry</text><text x="841" y="565" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">signed decision, digest,</text><text x="841" y="585" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">threshold, limitations</text><line x1="1135" y1="573" x2="1205" y2="573" stroke="#6941A5" stroke-width="2" marker-end="url(#arrow)"/><rect x="1205" y="510" width="310" height="125" rx="8" fill="#FFF1CC" stroke="#A96400" stroke-width="2"/><text x="1221" y="539" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">8. Controlled serving</text><text x="1221" y="565" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">canary, monitoring, rollback,</text><text x="1221" y="585" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">incidents</text><path d="M1545 248 V445 H65 V573" fill="none" stroke="#AAB7C4" stroke-width="2" marker-end="url(#arrow)"/><rect x="210" y="705" width="1180" height="150" rx="10" fill="#FCE1E0" stroke="#B3261E" stroke-width="2"/><text x="235" y="738" font-family="Arial" font-size="19" font-weight="700" fill="#B3261E" text-anchor="start">Hard gates</text><text x="235" y="770" font-family="Arial" font-size="16" font-weight="400" fill="#172B4D" text-anchor="start">Data: lawful provenance and representative scope  |  Training: successful convergence and reproducibility</text><text x="235" y="800" font-family="Arial" font-size="16" font-weight="400" fill="#172B4D" text-anchor="start">Validation: resolved critical findings  |  Fairness: approved trade-offs and residual risk  |  Deployment: signed artifact</text><text x="235" y="830" font-family="Arial" font-size="16" font-weight="400" fill="#172B4D" text-anchor="start">Monitoring breach: freeze promotion, preserve evidence, assess harm, roll back or recalibrate under change control</text><path d="M1385 635 H1490 V900 H180 V325 H65" fill="none" stroke="#B3261E" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="610" y="888" width="546" height="28" rx="14" fill="#FFF1CC" stroke="#A96400" stroke-width="1"/><text x="622" y="907" font-family="Arial" font-size="13" font-weight="700" fill="#172B4D" text-anchor="start">feedback path: outcomes → monitoring → governed retraining</text></svg>