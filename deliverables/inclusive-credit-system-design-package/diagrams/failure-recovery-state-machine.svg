<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter></defs><rect width="1600" height="980" fill="#FFFFFF"/><text x="56" y="58" font-family="Arial" font-size="30" font-weight="700" fill="#153B64" text-anchor="start">Serving failure and recovery state machine</text><text x="56" y="91" font-family="Arial" font-size="17" font-weight="400" fill="#52616F" text-anchor="start">Fail-closed target behavior for request, model, explanation, audit, and monitoring dependencies</text><line x1="56" y1="112" x2="1544" y2="112" stroke="#2E74B5" stroke-width="3"/><rect x="70" y="185" width="270" height="115" rx="8" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="86" y="214" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Receive request</text><text x="86" y="240" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">assign correlation ID;</text><text x="86" y="260" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">authenticate; enforce request</text><text x="86" y="280" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">and tenant policy</text><rect x="410" y="185" width="270" height="115" rx="8" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="426" y="214" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Validate contract</text><text x="426" y="240" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">pseudonymous reference,</text><text x="426" y="260" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">required names, types, bounds</text><text x="426" y="280" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">and schema compatibility</text><rect x="750" y="185" width="270" height="115" rx="8" fill="#EEE5F7" stroke="#6941A5" stroke-width="2"/><text x="766" y="214" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Load governed artifact</text><text x="766" y="240" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">approved current pointer,</text><text x="766" y="260" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">digest/signature, feature</text><text x="766" y="280" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">hash, threshold policy</text><rect x="1090" y="185" width="270" height="115" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="1106" y="214" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Compute decision</text><text x="1106" y="240" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">finite score, explicit policy</text><text x="1106" y="260" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">state, stable reasons and</text><text x="1106" y="280" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">version evidence</text><rect x="1260" y="430" width="270" height="115" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="1276" y="459" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Commit audit evidence</text><text x="1276" y="485" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">durable acknowledgement</text><text x="1276" y="505" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">before a consequential result</text><text x="1276" y="525" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">leaves the boundary</text><rect x="870" y="430" width="270" height="115" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="886" y="459" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Return response</text><text x="886" y="485" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">decision support result plus</text><text x="886" y="505" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">correlation, model, schema,</text><text x="886" y="525" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">policy and reason versions</text><rect x="480" y="430" width="270" height="115" rx="8" fill="#FFF1CC" stroke="#A96400" stroke-width="2"/><text x="496" y="459" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Degraded review path</text><text x="496" y="485" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">only under an approved lender</text><text x="496" y="505" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">policy; never substitute</text><text x="496" y="525" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">another model silently</text><rect x="90" y="430" width="270" height="115" rx="8" fill="#FCE1E0" stroke="#B3261E" stroke-width="2"/><text x="106" y="459" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Reject safely</text><text x="106" y="485" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">bounded status, safe message,</text><text x="106" y="505" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">correlation ID; no raw values</text><text x="106" y="525" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">or internal path</text><line x1="340" y1="242" x2="410" y2="242" stroke="#2E74B5" stroke-width="2" marker-end="url(#arrow)"/><line x1="680" y1="242" x2="750" y2="242" stroke="#6941A5" stroke-width="2" marker-end="url(#arrow)"/><line x1="1020" y1="242" x2="1090" y2="242" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><path d="M1225 300 V360 H1395 V430" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><line x1="1260" y1="487" x2="1140" y2="487" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><path d="M410 300 V370 H225 V430" fill="none" stroke="#B3261E" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M750 300 V370 H225 V430" fill="none" stroke="#B3261E" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M1090 300 V370 H615 V430" fill="none" stroke="#A96400" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M1260 545 V650 H225 V545" fill="none" stroke="#B3261E" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="160" y="700" width="1280" height="150" rx="10" fill="#F4F6F8" stroke="#AAB7C4" stroke-width="2"/><text x="185" y="733" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Implementation status</text><text x="185" y="765" font-family="Arial" font-size="16" font-weight="400" fill="#172B4D" text-anchor="start">Current code returns 400 for core contract errors and 503 when the model artifact is missing. API-key auth is optional.</text><text x="185" y="795" font-family="Arial" font-size="16" font-weight="400" fill="#172B4D" text-anchor="start">Idempotency, rate limits, tenant authorization, signature verification, durable audit acknowledgement, circuit breakers, and review-mode policy remain target controls.</text><rect x="550" y="886" width="240" height="28" rx="14" fill="#FCE1E0" stroke="#B3261E" stroke-width="1"/><text x="562" y="905" font-family="Arial" font-size="13" font-weight="700" fill="#172B4D" text-anchor="start">no silent model fallback</text><rect x="825" y="886" width="339" height="28" rx="14" fill="#FCE1E0" stroke="#B3261E" stroke-width="1"/><text x="837" y="905" font-family="Arial" font-size="13" font-weight="700" fill="#172B4D" text-anchor="start">no unaudited consequential response</text></svg>