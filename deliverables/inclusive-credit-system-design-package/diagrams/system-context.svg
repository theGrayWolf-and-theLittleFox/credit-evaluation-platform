<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter></defs><rect width="1600" height="980" fill="#FFFFFF"/><text x="56" y="58" font-family="Arial" font-size="30" font-weight="700" fill="#153B64" text-anchor="start">System context and decision boundary</text><text x="56" y="91" font-family="Arial" font-size="17" font-weight="400" fill="#52616F" text-anchor="start">External data and lender policy remain outside the model-serving trust boundary</text><line x1="56" y1="112" x2="1544" y2="112" stroke="#2E74B5" stroke-width="3"/><rect x="375" y="145" width="850" height="720" rx="16" fill="#FAFBFC" stroke="#2E74B5" stroke-width="3" stroke-dasharray="10 7"/><text x="405" y="180" font-family="Arial" font-size="15" font-weight="700" fill="#2E74B5" text-anchor="start">PLATFORM TRUST BOUNDARY</text><rect x="55" y="235" width="250" height="118" rx="8" fill="#F4F6F8" stroke="#AAB7C4" stroke-width="2"/><text x="71" y="264" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Applicant / borrower</text><text x="71" y="290" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Authorizes data access;</text><text x="71" y="310" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">receives lender decision,</text><text x="71" y="330" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">notice, and reconsideration</text><text x="71" y="350" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">path</text><rect x="55" y="445" width="250" height="118" rx="8" fill="#F4F6F8" stroke="#AAB7C4" stroke-width="2"/><text x="71" y="474" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Data providers</text><text x="71" y="500" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Rent, utility, and</text><text x="71" y="520" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">cash-flow aggregates;</text><text x="71" y="540" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">source provenance and</text><text x="71" y="560" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">consent evidence</text><rect x="1295" y="265" width="250" height="118" rx="8" fill="#F4F6F8" stroke="#AAB7C4" stroke-width="2"/><text x="1311" y="294" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Lender / LOS</text><text x="1311" y="320" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Owns credit policy, final</text><text x="1311" y="340" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">action, manual review,</text><text x="1311" y="360" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">notices, and overrides</text><rect x="1295" y="500" width="250" height="118" rx="8" fill="#F4F6F8" stroke="#AAB7C4" stroke-width="2"/><text x="1311" y="529" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Governance users</text><text x="1311" y="555" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Model risk, fair lending,</text><text x="1311" y="575" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">compliance, security,</text><text x="1311" y="595" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">operations, and audit</text><rect x="420" y="225" width="270" height="125" rx="8" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="436" y="254" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">API edge</text><text x="436" y="280" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Client identity, tenant</text><text x="436" y="300" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">authorization, schema and</text><text x="436" y="320" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">size limits, replay and rate</text><text x="436" y="340" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">controls</text><rect x="775" y="225" width="270" height="125" rx="8" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="791" y="254" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Decision service</text><text x="791" y="280" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Feature contract, approved</text><text x="791" y="300" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">model, threshold policy,</text><text x="791" y="320" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">reason-code mapper</text><rect x="420" y="440" width="270" height="125" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="436" y="469" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Audit plane</text><text x="436" y="495" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Minimal event schema,</text><text x="436" y="515" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">tokenized IDs, model and</text><text x="436" y="535" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">policy versions, integrity</text><text x="436" y="555" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">seal</text><rect x="775" y="440" width="270" height="125" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="791" y="469" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Monitoring plane</text><text x="791" y="495" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Outcome linkage, drift,</text><text x="791" y="515" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">calibration, subgroup</text><text x="791" y="535" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">metrics, alert evaluation</text><rect x="595" y="675" width="270" height="125" rx="8" fill="#EEE5F7" stroke="#6941A5" stroke-width="2"/><text x="611" y="704" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Model control plane</text><text x="611" y="730" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Training, validation,</text><text x="611" y="750" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">registry, approval record,</text><text x="611" y="770" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">signed artifact, rollback</text><line x1="305" y1="294" x2="420" y2="287" stroke="#2E74B5" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="276" font-family="Arial" font-size="14" font-weight="400" fill="#52616F" text-anchor="start">application data</text><path d="M305 504 H350 V335 H420" fill="none" stroke="#2E74B5" stroke-width="2" marker-end="url(#arrow)"/><text x="316" y="485" font-family="Arial" font-size="14" font-weight="400" fill="#52616F" text-anchor="start">verified aggregates</text><line x1="690" y1="287" x2="775" y2="287" stroke="#2E74B5" stroke-width="2" marker-end="url(#arrow)"/><line x1="1045" y1="287" x2="1295" y2="324" stroke="#2E74B5" stroke-width="2" marker-end="url(#arrow)"/><text x="1084" y="278" font-family="Arial" font-size="14" font-weight="400" fill="#52616F" text-anchor="start">score + recommendation + reasons</text><path d="M910 350 V405 H555 V440" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><path d="M910 350 V405 H910 V440" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 502 H775" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><path d="M1045 502 H1180 V559 H1295" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><text x="1072" y="484" font-family="Arial" font-size="14" font-weight="400" fill="#52616F" text-anchor="start">alerts / reports</text><path d="M730 675 V620 H555 V565" fill="none" stroke="#6941A5" stroke-width="2" marker-end="url(#arrow)"/><path d="M730 675 V620 H910 V565" fill="none" stroke="#6941A5" stroke-width="2" marker-end="url(#arrow)"/><path d="M865 736 H1130 V360 H1045" fill="none" stroke="#6941A5" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="945" y="718" font-family="Arial" font-size="14" font-weight="400" fill="#52616F" text-anchor="start">approved artifact + policy</text><rect x="420" y="842" width="429" height="28" rx="14" fill="#FFF1CC" stroke="#A96400" stroke-width="1"/><text x="432" y="861" font-family="Arial" font-size="13" font-weight="700" fill="#172B4D" text-anchor="start">prediction data excludes protected attributes</text><rect x="800" y="842" width="501" height="28" rx="14" fill="#FFF1CC" stroke="#A96400" stroke-width="1"/><text x="812" y="861" font-family="Arial" font-size="13" font-weight="700" fill="#172B4D" text-anchor="start">monitoring attributes separated and access-controlled</text></svg>