<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter></defs><rect width="1600" height="980" fill="#FFFFFF"/><text x="56" y="58" font-family="Arial" font-size="30" font-weight="700" fill="#153B64" text-anchor="start">Feature contract and scoring pipeline</text><text x="56" y="91" font-family="Arial" font-size="17" font-weight="400" fill="#52616F" text-anchor="start">Current main-path behavior from typed request through decision, explanation, and audit evidence</text><line x1="56" y1="112" x2="1544" y2="112" stroke="#2E74B5" stroke-width="3"/><rect x="55" y="190" width="220" height="145" rx="8" fill="#F4F6F8" stroke="#AAB7C4" stroke-width="2"/><text x="71" y="219" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">1. Request schema</text><text x="71" y="245" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">pseudonymous</text><text x="71" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">application_id; numeric</text><text x="71" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">feature map; optional</text><text x="71" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">monitoring attributes</text><line x1="275" y1="262" x2="315" y2="262" stroke="#2E74B5" stroke-width="2" marker-end="url(#arrow)"/><rect x="315" y="190" width="220" height="145" rx="8" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="331" y="219" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">2. Contract validation</text><text x="331" y="245" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">required names;</text><text x="331" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">unknown-name rejection;</text><text x="331" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">numeric type check;</text><text x="331" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">fixed column order</text><line x1="535" y1="262" x2="575" y2="262" stroke="#2E74B5" stroke-width="2" marker-end="url(#arrow)"/><rect x="575" y="190" width="220" height="145" rx="8" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="591" y="219" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">3. Sanitization</text><text x="591" y="245" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">clamp two payment</text><text x="591" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">rates; prevent negative</text><text x="591" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">NSF and overdraft</text><text x="591" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">counts</text><line x1="795" y1="262" x2="835" y2="262" stroke="#2E74B5" stroke-width="2" marker-end="url(#arrow)"/><rect x="835" y="190" width="220" height="145" rx="8" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="851" y="219" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">4. Vectorization</text><text x="851" y="245" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">required then optional</text><text x="851" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">columns; missing</text><text x="851" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">optional values become</text><text x="851" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">0.0; float array</text><line x1="1055" y1="262" x2="1095" y2="262" stroke="#2E74B5" stroke-width="2" marker-end="url(#arrow)"/><rect x="1095" y="190" width="220" height="145" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="1111" y="219" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">5. Model inference</text><text x="1111" y="245" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">approved-current</text><text x="1111" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">registry pointer or</text><text x="1111" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">fallback path; logistic</text><text x="1111" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">probability</text><line x1="1315" y1="262" x2="1355" y2="262" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><rect x="1355" y="190" width="190" height="145" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="1371" y="219" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">6. Policy</text><text x="1371" y="245" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">threshold</text><text x="1371" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">comparison; approve</text><text x="1371" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">or deny</text><rect x="190" y="500" width="310" height="135" rx="8" fill="#FFF1CC" stroke="#A96400" stroke-width="2"/><text x="206" y="529" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Reason-code path</text><text x="206" y="555" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Seven heuristic conditions rank</text><text x="206" y="575" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">up to four codes by threshold</text><text x="206" y="595" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">distance; optional tenure fields</text><text x="206" y="615" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">have no heuristic code</text><rect x="645" y="500" width="310" height="135" rx="8" fill="#FFF1CC" stroke="#A96400" stroke-width="2"/><text x="661" y="529" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Contribution path</text><text x="661" y="555" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Linear proxy returns coefficient</text><text x="661" y="575" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">multiplied by raw ordered feature</text><text x="661" y="595" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">value; base value is not returned</text><rect x="1100" y="500" width="310" height="160" rx="8" fill="#EEE5F7" stroke="#6941A5" stroke-width="2"/><text x="1116" y="529" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Decision-event path</text><text x="1116" y="555" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Tokenized application reference,</text><text x="1116" y="575" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">request and model versions,</text><text x="1116" y="595" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">score, threshold, reasons,</text><text x="1116" y="615" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">feature hash; raw values off by</text><text x="1116" y="635" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">default</text><path d="M1450 335 V425 H345 V500" fill="none" stroke="#A96400" stroke-width="2" marker-end="url(#arrow)"/><path d="M1190 335 V420 H800 V500" fill="none" stroke="#A96400" stroke-width="2" marker-end="url(#arrow)"/><path d="M1450 335 V445 H1255 V500" fill="none" stroke="#6941A5" stroke-width="2" marker-end="url(#arrow)"/><rect x="180" y="720" width="1240" height="130" rx="10" fill="#FCE1E0" stroke="#B3261E" stroke-width="2"/><text x="205" y="752" font-family="Arial" font-size="19" font-weight="700" fill="#B3261E" text-anchor="start">Current boundary conditions</text><text x="205" y="782" font-family="Arial" font-size="16" font-weight="400" fill="#172B4D" text-anchor="start">Published UI minima and maxima are descriptive metadata; the main backend does not reject every out-of-range value.</text><text x="205" y="810" font-family="Arial" font-size="16" font-weight="400" fill="#172B4D" text-anchor="start">Reason codes and coefficient proxies require separate fidelity validation before borrower-notice or adverse-action use.</text><rect x="505" y="884" width="519" height="28" rx="14" fill="#DFF2E1" stroke="#2E7D32" stroke-width="1"/><text x="517" y="903" font-family="Arial" font-size="13" font-weight="700" fill="#172B4D" text-anchor="start">protected attributes are excluded from the model vector</text></svg>