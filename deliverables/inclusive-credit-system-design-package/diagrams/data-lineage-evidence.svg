<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter></defs><rect width="1600" height="980" fill="#FFFFFF"/><text x="56" y="58" font-family="Arial" font-size="30" font-weight="700" fill="#153B64" text-anchor="start">Data lineage, feature contract, and evidence linkage</text><text x="56" y="91" font-family="Arial" font-size="17" font-weight="400" fill="#52616F" text-anchor="start">Prediction data, monitoring attributes, and model-governance metadata follow separate controlled paths</text><line x1="56" y1="112" x2="1544" y2="112" stroke="#2E74B5" stroke-width="3"/><rect x="55" y="210" width="220" height="120" rx="8" fill="#F4F6F8" stroke="#AAB7C4" stroke-width="2"/><text x="71" y="239" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Permissioned sources</text><text x="71" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Provider record ID,</text><text x="71" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">source type, consent</text><text x="71" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">reference, coverage</text><text x="71" y="325" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">window, correction</text><text x="71" y="345" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">status</text><rect x="330" y="210" width="220" height="120" rx="8" fill="#F4F6F8" stroke="#AAB7C4" stroke-width="2"/><text x="346" y="239" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Raw landing zone</text><text x="346" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Encrypted object,</text><text x="346" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">checksum, provider</text><text x="346" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">manifest, restricted</text><text x="346" y="325" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">access, retention class</text><rect x="605" y="210" width="220" height="120" rx="8" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="621" y="239" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Validated snapshot</text><text x="621" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Schema result, row</text><text x="621" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">reconciliation, quality</text><text x="621" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">exceptions, immutable</text><text x="621" y="325" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">snapshot ID</text><rect x="880" y="210" width="220" height="120" rx="8" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="896" y="239" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Feature pipeline</text><text x="896" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Versioned code, fitted</text><text x="896" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">transforms, missingness</text><text x="896" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">policy, ordered vector</text><rect x="1155" y="210" width="220" height="120" rx="8" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="1171" y="239" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Feature contract</text><text x="1171" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Name, type, unit,</text><text x="1171" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">range, lookback,</text><text x="1171" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">source, reason mapping,</text><text x="1171" y="325" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">schema hash</text><line x1="275" y1="270" x2="330" y2="270" stroke="#AAB7C4" stroke-width="2" marker-end="url(#arrow)"/><line x1="550" y1="270" x2="605" y2="270" stroke="#AAB7C4" stroke-width="2" marker-end="url(#arrow)"/><line x1="825" y1="270" x2="880" y2="270" stroke="#AAB7C4" stroke-width="2" marker-end="url(#arrow)"/><line x1="1100" y1="270" x2="1155" y2="270" stroke="#AAB7C4" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="455" width="270" height="125" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="346" y="484" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Training matrix</text><text x="346" y="510" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Snapshot ID + split hash +</text><text x="346" y="530" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">feature hash + target</text><text x="346" y="550" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">definition; protected</text><text x="346" y="570" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">attributes excluded from</text><text x="346" y="590" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">predictors</text><rect x="690" y="455" width="270" height="125" rx="8" fill="#FFF1CC" stroke="#A96400" stroke-width="2"/><text x="706" y="484" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Sensitive monitoring enclave</text><text x="706" y="510" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Lawful protected or proxy</text><text x="706" y="530" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">attributes; tokenized join</text><text x="706" y="550" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">key; restricted analysts;</text><text x="706" y="570" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">aggregate release</text><rect x="1050" y="455" width="270" height="125" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="1066" y="484" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Outcome store</text><text x="1066" y="510" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Tokenized application</text><text x="1066" y="530" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">linkage; label definition and</text><text x="1066" y="550" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">maturity; corrections and</text><text x="1066" y="570" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">provenance</text><path d="M715 330 V400 H465 V455" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><path d="M715 330 V400 H825 V455" fill="none" stroke="#A96400" stroke-width="2" marker-end="url(#arrow)"/><path d="M1265 330 V400 H1185 V455" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><rect x="165" y="690" width="270" height="125" rx="8" fill="#EEE5F7" stroke="#6941A5" stroke-width="2"/><text x="181" y="719" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Model artifact</text><text x="181" y="745" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Serialized pipeline,</text><text x="181" y="765" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">dependency manifest, digest,</text><text x="181" y="785" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">signature, training</text><text x="181" y="805" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">configuration</text><rect x="530" y="690" width="270" height="125" rx="8" fill="#EEE5F7" stroke="#6941A5" stroke-width="2"/><text x="546" y="719" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Registry record</text><text x="546" y="745" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Artifact digest, feature</text><text x="546" y="765" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">hash, threshold, reports,</text><text x="546" y="785" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">validation and approval</text><text x="546" y="805" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">references</text><rect x="895" y="690" width="270" height="125" rx="8" fill="#EEE5F7" stroke="#6941A5" stroke-width="2"/><text x="911" y="719" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Decision audit event</text><text x="911" y="745" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Tokenized ID, request ID,</text><text x="911" y="765" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">model/policy versions, score,</text><text x="911" y="785" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">reasons, feature hash,</text><text x="911" y="805" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">integrity seal</text><rect x="1260" y="690" width="270" height="125" rx="8" fill="#EEE5F7" stroke="#6941A5" stroke-width="2"/><text x="1276" y="719" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Monitoring record</text><text x="1276" y="745" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Joined outcomes and aggregate</text><text x="1276" y="765" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">group metrics; uncertainty,</text><text x="1276" y="785" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">drift state, trigger</text><text x="1276" y="805" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">disposition</text><path d="M465 580 V630 H300 V690" fill="none" stroke="#6941A5" stroke-width="2" marker-end="url(#arrow)"/><line x1="435" y1="752" x2="530" y2="752" stroke="#6941A5" stroke-width="2" marker-end="url(#arrow)"/><line x1="800" y1="752" x2="895" y2="752" stroke="#6941A5" stroke-width="2" marker-end="url(#arrow)"/><line x1="1165" y1="752" x2="1260" y2="752" stroke="#6941A5" stroke-width="2" marker-end="url(#arrow)"/><path d="M825 580 V635 H1395 V690" fill="none" stroke="#A96400" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M1185 580 V635 H1395 V690" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="875" width="735" height="28" rx="14" fill="#FFF1CC" stroke="#A96400" stroke-width="1"/><text x="82" y="894" font-family="Arial" font-size="13" font-weight="700" fill="#172B4D" text-anchor="start">join keys are tokenized; direct identifiers are excluded from analytical stores</text><rect x="790" y="875" width="402" height="28" rx="14" fill="#DFF2E1" stroke="#2E7D32" stroke-width="1"/><text x="802" y="894" font-family="Arial" font-size="13" font-weight="700" fill="#172B4D" text-anchor="start">schema hash prevents training-serving skew</text></svg>