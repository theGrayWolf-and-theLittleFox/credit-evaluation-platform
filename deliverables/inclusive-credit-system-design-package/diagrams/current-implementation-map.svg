<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter></defs><rect width="1600" height="980" fill="#FFFFFF"/><text x="56" y="58" font-family="Arial" font-size="30" font-weight="700" fill="#153B64" text-anchor="start">Current implementation map</text><text x="56" y="91" font-family="Arial" font-size="17" font-weight="400" fill="#52616F" text-anchor="start">Repository-level view of the active demonstration path and the two alternate implementation families</text><line x1="56" y1="112" x2="1544" y2="112" stroke="#2E74B5" stroke-width="3"/><rect x="45" y="145" width="1510" height="735" rx="14" fill="#FBFCFD" stroke="#AAB7C4" stroke-width="2"/><rect x="75" y="190" width="300" height="165" rx="8" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="91" y="219" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">React operator console</text><text x="91" y="245" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">App orchestration,</text><text x="91" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">contract-driven form, scoring,</text><text x="91" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">explanation, fairness,</text><text x="91" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">portfolio, outcomes, governance,</text><text x="91" y="325" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">audit explorer</text><rect x="470" y="190" width="300" height="165" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="486" y="219" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">services/api</text><text x="486" y="245" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Principal documented FastAPI</text><text x="486" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">path: nine routes, API-key</text><text x="486" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">dependency, privacy validation,</text><text x="486" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">JSONL/SQLite audit</text><rect x="865" y="190" width="300" height="165" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="881" y="219" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">src/ice</text><text x="881" y="245" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Core contract, model</text><text x="881" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">abstraction, logistic-regression</text><text x="881" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">bundle, training, reasons,</text><text x="881" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">fairness metrics, audit</text><text x="881" y="325" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">primitives</text><rect x="1260" y="190" width="250" height="165" rx="8" fill="#EEE5F7" stroke="#6941A5" stroke-width="2"/><text x="1276" y="219" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">artifacts</text><text x="1276" y="245" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Synthetic data, model</text><text x="1276" y="265" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">bundle, registry JSON,</text><text x="1276" y="285" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">report JSON, JSONL and</text><text x="1276" y="305" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">optional SQLite evidence</text><line x1="375" y1="272" x2="470" y2="272" stroke="#2E74B5" stroke-width="2" marker-end="url(#arrow)"/><line x1="770" y1="272" x2="865" y2="272" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><line x1="1165" y1="272" x2="1260" y2="272" stroke="#6941A5" stroke-width="2" marker-end="url(#arrow)"/><rect x="165" y="375" width="267" height="28" rx="14" fill="#DDEFFC" stroke="#2E74B5" stroke-width="1"/><text x="177" y="394" font-family="Arial" font-size="13" font-weight="700" fill="#172B4D" text-anchor="start">active frontend integration</text><rect x="555" y="375" width="222" height="28" rx="14" fill="#DFF2E1" stroke="#2E7D32" stroke-width="1"/><text x="567" y="394" font-family="Arial" font-size="13" font-weight="700" fill="#172B4D" text-anchor="start">principal dossier path</text><rect x="955" y="375" width="123" height="28" rx="14" fill="#DFF2E1" stroke="#2E7D32" stroke-width="1"/><text x="967" y="394" font-family="Arial" font-size="13" font-weight="700" fill="#172B4D" text-anchor="start">shared core</text><rect x="120" y="470" width="385" height="145" rx="8" fill="#FFF1CC" stroke="#A96400" stroke-width="2"/><text x="136" y="499" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">src/flg alternate family</text><text x="136" y="525" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Strict eight-feature vector; scaled</text><text x="136" y="545" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">logistic regression; approve/review/deny</text><text x="136" y="565" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">thresholds; coefficient reason records;</text><text x="136" y="585" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">per-file JSONL audit</text><rect x="610" y="470" width="385" height="145" rx="8" fill="#FFF1CC" stroke="#A96400" stroke-width="2"/><text x="626" y="499" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">src/mie_credit_platform alternate family</text><text x="626" y="525" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Typed eight-feature schema; CLI and API;</text><text x="626" y="545" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">approval-aware registry; SQLite/JSONL</text><text x="626" y="565" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">audit with configurable redaction</text><rect x="1100" y="470" width="360" height="145" rx="8" fill="#F4F6F8" stroke="#AAB7C4" stroke-width="2"/><text x="1116" y="499" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Shared repository tests</text><text x="1116" y="525" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Main-path end-to-end, governance,</text><text x="1116" y="545" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">privacy and fairness tests plus an FLG</text><text x="1116" y="565" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">smoke test; one unresolved governance</text><text x="1116" y="585" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">expectation</text><path d="M312 470 V430 H620 V355" fill="none" stroke="#A96400" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M802 470 V430 H1015 V355" fill="none" stroke="#A96400" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><line x1="995" y1="542" x2="1100" y2="542" stroke="#AAB7C4" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="690" width="1340" height="125" rx="10" fill="#FCE1E0" stroke="#B3261E" stroke-width="2"/><text x="155" y="722" font-family="Arial" font-size="19" font-weight="700" fill="#B3261E" text-anchor="start">Canonicalization requirement</text><text x="155" y="753" font-family="Arial" font-size="16" font-weight="400" fill="#172B4D" text-anchor="start">The three Python families use different feature names, lookback windows, decision states, schemas, registries, and audit formats.</text><text x="155" y="782" font-family="Arial" font-size="16" font-weight="400" fill="#172B4D" text-anchor="start">Production work must select one contract, migrate retained behavior under tests, and retire the other public serving paths.</text><rect x="475" y="842" width="555" height="28" rx="14" fill="#F4F6F8" stroke="#AAB7C4" stroke-width="1"/><text x="487" y="861" font-family="Arial" font-size="13" font-weight="700" fill="#172B4D" text-anchor="start">dashed lines indicate conceptual overlap, not runtime calls</text></svg>