<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter></defs><rect width="1600" height="980" fill="#FFFFFF"/><text x="56" y="58" font-family="Arial" font-size="30" font-weight="700" fill="#153B64" text-anchor="start">API surface and audit-event topology</text><text x="56" y="91" font-family="Arial" font-size="17" font-weight="400" fill="#52616F" text-anchor="start">Principal services/api routes, core handlers, emitted evidence, and read-side dependencies</text><line x1="56" y1="112" x2="1544" y2="112" stroke="#2E74B5" stroke-width="3"/><rect x="60" y="155" width="270" height="725" rx="12" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="85" y="187" font-family="Arial" font-size="16" font-weight="700" fill="#153B64" text-anchor="start">HTTP SURFACE</text><rect x="82" y="210" width="226" height="48" rx="8" fill="#FFFFFF" stroke="#AAB7C4" stroke-width="2"/><text x="98" y="240" font-family="Arial" font-size="14.5" font-weight="700" fill="#153B64" text-anchor="start">GET /health</text><rect x="82" y="271" width="226" height="48" rx="8" fill="#FFFFFF" stroke="#2E74B5" stroke-width="2"/><text x="98" y="301" font-family="Arial" font-size="14.5" font-weight="700" fill="#153B64" text-anchor="start">GET /v1/models/current</text><rect x="82" y="332" width="226" height="48" rx="8" fill="#FFFFFF" stroke="#2E74B5" stroke-width="2"/><text x="98" y="362" font-family="Arial" font-size="14.5" font-weight="700" fill="#153B64" text-anchor="start">GET /v1/features/contract</text><rect x="82" y="393" width="226" height="48" rx="8" fill="#FFFFFF" stroke="#2E74B5" stroke-width="2"/><text x="98" y="423" font-family="Arial" font-size="14.5" font-weight="700" fill="#153B64" text-anchor="start">POST /v1/score</text><rect x="82" y="454" width="226" height="48" rx="8" fill="#FFFFFF" stroke="#2E74B5" stroke-width="2"/><text x="98" y="484" font-family="Arial" font-size="14.5" font-weight="700" fill="#153B64" text-anchor="start">POST /v1/explain</text><rect x="82" y="515" width="226" height="48" rx="8" fill="#FFFFFF" stroke="#2E74B5" stroke-width="2"/><text x="98" y="545" font-family="Arial" font-size="14.5" font-weight="700" fill="#153B64" text-anchor="start">POST /v1/portfolio/analyze</text><rect x="82" y="576" width="226" height="48" rx="8" fill="#FFFFFF" stroke="#2E74B5" stroke-width="2"/><text x="98" y="606" font-family="Arial" font-size="14.5" font-weight="700" fill="#153B64" text-anchor="start">POST /v1/audit/fairness</text><rect x="82" y="637" width="226" height="48" rx="8" fill="#FFFFFF" stroke="#2E74B5" stroke-width="2"/><text x="98" y="667" font-family="Arial" font-size="14.5" font-weight="700" fill="#153B64" text-anchor="start">POST /v1/audit/events</text><rect x="82" y="698" width="226" height="48" rx="8" fill="#FFFFFF" stroke="#2E74B5" stroke-width="2"/><text x="98" y="728" font-family="Arial" font-size="14.5" font-weight="700" fill="#153B64" text-anchor="start">GET /v1/audit/events</text><rect x="82" y="759" width="226" height="48" rx="8" fill="#FFFFFF" stroke="#2E74B5" stroke-width="2"/><text x="98" y="789" font-family="Arial" font-size="14.5" font-weight="700" fill="#153B64" text-anchor="start">GET /v1/governance/summary</text><rect x="385" y="155" width="390" height="725" rx="12" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="410" y="187" font-family="Arial" font-size="16" font-weight="700" fill="#153B64" text-anchor="start">APPLICATION SERVICES</text><rect x="420" y="220" width="320" height="100" rx="8" fill="#FFFFFF" stroke="#AAB7C4" stroke-width="2"/><text x="436" y="249" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">ModelStore + registry</text><text x="436" y="275" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Resolve current entry, fall back</text><text x="436" y="295" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">to configured model path, load</text><text x="436" y="315" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">joblib bundle</text><rect x="420" y="355" width="320" height="100" rx="8" fill="#FFFFFF" stroke="#AAB7C4" stroke-width="2"/><text x="436" y="384" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Scoring + explanation</text><text x="436" y="410" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Sanitize, vectorize, predict,</text><text x="436" y="430" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">threshold, heuristic reasons,</text><text x="436" y="450" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">linear contributions</text><rect x="420" y="490" width="320" height="100" rx="8" fill="#FFFFFF" stroke="#AAB7C4" stroke-width="2"/><text x="436" y="519" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Portfolio + fairness</text><text x="436" y="545" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Cohort scoring, bands, reason</text><text x="436" y="565" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">counts, group rates, parity and</text><text x="436" y="585" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">opportunity gaps</text><rect x="420" y="625" width="320" height="100" rx="8" fill="#FFFFFF" stroke="#AAB7C4" stroke-width="2"/><text x="436" y="654" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Privacy + governance</text><text x="436" y="680" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Pseudonymous ID validation,</text><text x="436" y="700" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">optional hashing, coverage</text><text x="436" y="720" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">controls, readiness state</text><rect x="830" y="155" width="310" height="725" rx="12" fill="#EEE5F7" stroke="#6941A5" stroke-width="2"/><text x="855" y="187" font-family="Arial" font-size="16" font-weight="700" fill="#153B64" text-anchor="start">WRITE-SIDE EVENTS</text><rect x="865" y="220" width="240" height="105" rx="8" fill="#FFFFFF" stroke="#6941A5" stroke-width="2"/><text x="881" y="249" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">decision</text><text x="881" y="275" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">score, decision,</text><text x="881" y="295" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">threshold, reasons,</text><text x="881" y="315" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">feature hash</text><rect x="865" y="343" width="240" height="105" rx="8" fill="#FFFFFF" stroke="#6941A5" stroke-width="2"/><text x="881" y="372" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">explain</text><text x="881" y="398" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">score, reason list,</text><text x="881" y="418" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">contribution count</text><rect x="865" y="466" width="240" height="105" rx="8" fill="#FFFFFF" stroke="#6941A5" stroke-width="2"/><text x="881" y="495" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">portfolio_analysis</text><text x="881" y="521" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">count, score and decision</text><text x="881" y="541" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">aggregates, group key</text><rect x="865" y="589" width="240" height="105" rx="8" fill="#FFFFFF" stroke="#6941A5" stroke-width="2"/><text x="881" y="618" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">fairness_report</text><text x="881" y="644" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">groups, counts and two</text><text x="881" y="664" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">difference metrics</text><rect x="865" y="712" width="240" height="105" rx="8" fill="#FFFFFF" stroke="#6941A5" stroke-width="2"/><text x="881" y="741" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">outcome</text><text x="881" y="767" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">repayment window, binary</text><text x="881" y="787" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">observed result</text><rect x="1195" y="155" width="350" height="725" rx="12" fill="#F4F6F8" stroke="#AAB7C4" stroke-width="2"/><text x="1220" y="187" font-family="Arial" font-size="16" font-weight="700" fill="#153B64" text-anchor="start">PERSISTENCE + READ SIDE</text><rect x="1230" y="235" width="280" height="110" rx="8" fill="#FFFFFF" stroke="#AAB7C4" stroke-width="2"/><text x="1246" y="264" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">JSONL event stream</text><text x="1246" y="290" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Append current events; list,</text><text x="1246" y="310" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">filter, normalize, sort,</text><text x="1246" y="330" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">paginate</text><rect x="1230" y="400" width="280" height="110" rx="8" fill="#FFFFFF" stroke="#AAB7C4" stroke-width="2"/><text x="1246" y="429" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Optional SQLite mirror</text><text x="1246" y="455" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Decision and outcome tables</text><text x="1246" y="475" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">only in the main path</text><rect x="1230" y="565" width="280" height="110" rx="8" fill="#FFFFFF" stroke="#AAB7C4" stroke-width="2"/><text x="1246" y="594" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Audit explorer</text><text x="1246" y="620" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Reads normalized events by</text><text x="1246" y="640" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">type or application reference</text><rect x="1230" y="730" width="280" height="105" rx="8" fill="#FFFFFF" stroke="#AAB7C4" stroke-width="2"/><text x="1246" y="759" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Governance summary</text><text x="1246" y="785" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Reads up to 250 events;</text><text x="1246" y="805" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">derives coverage and threshold</text><text x="1246" y="825" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">status</text><line x1="330" y1="505" x2="385" y2="505" stroke="#2E74B5" stroke-width="2" marker-end="url(#arrow)"/><line x1="775" y1="505" x2="830" y2="505" stroke="#6941A5" stroke-width="2" marker-end="url(#arrow)"/><line x1="1140" y1="505" x2="1195" y2="505" stroke="#6941A5" stroke-width="2" marker-end="url(#arrow)"/><rect x="475" y="900" width="411" height="28" rx="14" fill="#FFF1CC" stroke="#A96400" stroke-width="1"/><text x="487" y="919" font-family="Arial" font-size="13" font-weight="700" fill="#172B4D" text-anchor="start">health is outside the v1 API-key dependency</text><rect x="975" y="900" width="321" height="28" rx="14" fill="#FCE1E0" stroke="#B3261E" stroke-width="1"/><text x="987" y="919" font-family="Arial" font-size="13" font-weight="700" fill="#172B4D" text-anchor="start">outcome writes are not idempotent</text></svg>