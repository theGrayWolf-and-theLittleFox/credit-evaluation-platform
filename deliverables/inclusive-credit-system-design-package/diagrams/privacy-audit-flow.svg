<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter></defs><rect width="1600" height="980" fill="#FFFFFF"/><text x="56" y="58" font-family="Arial" font-size="30" font-weight="700" fill="#153B64" text-anchor="start">Privacy minimization and audit flow</text><text x="56" y="91" font-family="Arial" font-size="17" font-weight="400" fill="#52616F" text-anchor="start">Current controls for applicant references, feature evidence, monitoring attributes, and operator reads</text><line x1="56" y1="112" x2="1544" y2="112" stroke="#2E74B5" stroke-width="3"/><rect x="55" y="185" width="260" height="125" rx="8" fill="#F4F6F8" stroke="#AAB7C4" stroke-width="2"/><text x="71" y="214" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Client payload</text><text x="71" y="240" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">pseudonymous application</text><text x="71" y="260" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">reference; scored features;</text><text x="71" y="280" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">optional sensitive</text><text x="71" y="300" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">monitoring context</text><rect x="370" y="185" width="260" height="125" rx="8" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="386" y="214" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Reference validator</text><text x="386" y="240" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">allowlisted characters and</text><text x="386" y="260" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">length; reject email,</text><text x="386" y="280" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">telephone, government-ID and</text><text x="386" y="300" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">whitespace patterns</text><rect x="685" y="185" width="260" height="125" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="701" y="214" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Audit identifier policy</text><text x="701" y="240" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">SHA-256 with optional</text><text x="701" y="260" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">deployment salt; ref_</text><text x="701" y="280" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">prefix; hashing enabled by</text><text x="701" y="300" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">default</text><rect x="1000" y="185" width="260" height="125" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="1016" y="214" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Decision event minimizer</text><text x="1016" y="240" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">feature hash always; raw</text><text x="1016" y="260" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">features disabled by</text><text x="1016" y="280" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">default; sensitive context</text><text x="1016" y="300" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">disabled by default</text><rect x="1315" y="185" width="230" height="125" rx="8" fill="#EEE5F7" stroke="#6941A5" stroke-width="2"/><text x="1331" y="214" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Storage</text><text x="1331" y="240" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">JSONL append; optional</text><text x="1331" y="260" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">SQLite decision and</text><text x="1331" y="280" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">outcome mirror</text><line x1="315" y1="247" x2="370" y2="247" stroke="#2E74B5" stroke-width="2" marker-end="url(#arrow)"/><line x1="630" y1="247" x2="685" y2="247" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><line x1="945" y1="247" x2="1000" y2="247" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><line x1="1260" y1="247" x2="1315" y2="247" stroke="#6941A5" stroke-width="2" marker-end="url(#arrow)"/><rect x="135" y="455" width="300" height="160" rx="8" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="151" y="484" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Scoring response</text><text x="151" y="510" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Returns the submitted</text><text x="151" y="530" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">pseudonymous reference, request</text><text x="151" y="550" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">ID, model/schema versions,</text><text x="151" y="570" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">decision evidence; client</text><text x="151" y="590" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">handles display</text><rect x="540" y="455" width="300" height="160" rx="8" fill="#DDEFFC" stroke="#2E74B5" stroke-width="2"/><text x="556" y="484" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Audit read API</text><text x="556" y="510" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Filters application reference</text><text x="556" y="530" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">through the same hashing policy</text><text x="556" y="550" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">before matching stored events</text><rect x="945" y="455" width="300" height="160" rx="8" fill="#DFF2E1" stroke="#2E7D32" stroke-width="2"/><text x="961" y="484" font-family="Arial" font-size="19" font-weight="700" fill="#153B64" text-anchor="start">Outcome linkage</text><text x="961" y="510" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">Uses the same tokenized</text><text x="961" y="530" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">reference so later outcomes can</text><text x="961" y="550" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">be joined without storing the</text><text x="961" y="570" font-family="Arial" font-size="15" font-weight="400" fill="#52616F" text-anchor="start">source reference</text><path d="M500 310 V400 H285 V455" fill="none" stroke="#2E74B5" stroke-width="2" marker-end="url(#arrow)"/><path d="M800 310 V400 H690 V455" fill="none" stroke="#2E74B5" stroke-width="2" marker-end="url(#arrow)"/><path d="M800 310 V400 H1095 V455" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/><rect x="185" y="720" width="1230" height="130" rx="10" fill="#FCE1E0" stroke="#B3261E" stroke-width="2"/><text x="210" y="752" font-family="Arial" font-size="19" font-weight="700" fill="#B3261E" text-anchor="start">Production controls still required</text><text x="210" y="782" font-family="Arial" font-size="16" font-weight="400" fill="#172B4D" text-anchor="start">Secret-managed nonempty salt, tenant-scoped tokens, encryption and key rotation, immutable storage, retention and deletion policy,</text><text x="210" y="810" font-family="Arial" font-size="16" font-weight="400" fill="#172B4D" text-anchor="start">purpose-based access, export controls, breach monitoring, correction workflow, and proof that raw request bodies are absent from telemetry.</text><rect x="540" y="884" width="447" height="28" rx="14" fill="#FFF1CC" stroke="#A96400" stroke-width="1"/><text x="552" y="903" font-family="Arial" font-size="13" font-weight="700" fill="#172B4D" text-anchor="start">a pseudonymous reference is still linkable data</text></svg>